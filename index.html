<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - Ứng dụng Trắc nghiệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .progress-container {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 10px;
            margin-top: 20px;
        }

        .progress-bar {
            background: #2196F3;
            height: 8px;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .quiz-container {
            padding: 40px;
        }

        .question-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .question-container.active {
            display: block;
        }

        .question {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .option:hover:not(.disabled) {
            background: #e3f2fd;
            border-color: #2196F3;
            transform: translateX(5px);
        }

        .option.selected {
            background: #e8f5e8;
            border-color: #4CAF50;
        }

        .option.correct {
            background: #d4edda !important;
            border-color: #4CAF50 !important;
            position: relative;
        }

        .option.correct::after {
            content: '✓';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #4CAF50;
            font-size: 1.5em;
            font-weight: bold;
        }

        .option.incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            position: relative;
        }

        .option.incorrect::after {
            content: '✗';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #dc3545;
            font-size: 1.5em;
            font-weight: bold;
        }

        .option.disabled {
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
        }

        .btn-primary:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results-container {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .score {
            font-size: 4em;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
        }

        .score-text {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #2196F3;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #2196F3;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .feedback-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback-message.show {
            opacity: 1;
        }

        .feedback-message.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-message.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">⏱️ 00:00</div>

        </div>

            <!-- Questions will be inserted here -->

        <div class="results-container" id="resultsContainer">

            <div class="score-text" id="scoreText"></div>
            
            <div class="stats">

                </div>
                <div class="stat-item">

                    <div class="stat-label">Câu sai</div>

                <div class="stat-item">

                    <div class="stat-label">Thời gian</div>
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại</button>
        </div>
    </div>

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = [];
        let startTime = Date.now();
        let timerInterval;
        let isAnswered = false;

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `⏱️ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateProgress() {
            const progress = (currentQuestion / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Câu hỏi ${currentQuestion + 1}/${quizData.length}`;
        }

        function displayQuestion() {
            const questionData = quizData[currentQuestion];
            const container = document.getElementById('quizContainer');
            isAnswered = false;
            
            container.innerHTML = `
                <div class="question-container active">
                    <div class="question">
                        Câu ${currentQuestion + 1}: ${questionData.question}
                    </div>
                    <div class="options">
                        ${questionData.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <strong>${String.fromCharCode(65 + index)}.</strong> ${option}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback-message" id="feedbackMessage"></div>
                    <div class="controls">
                        <button class="btn btn-primary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                            ← Câu trước
                        </button>
                        <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()" disabled style="display: none;">
                            ${currentQuestion === quizData.length - 1 ? 'Kết thúc' : 'Câu tiếp →'}
                        </button>
                    </div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            if (isAnswered) return; // Prevent multiple selections
            
            isAnswered = true;
            const options = document.querySelectorAll('.option');
            const correctIndex = quizData[currentQuestion].correct;
            const feedbackMessage = document.getElementById('feedbackMessage');
            const nextBtn = document.getElementById('nextBtn');
            
            // Store answer
            userAnswers[currentQuestion] = index;
            
            // Disable all options
            options.forEach(opt => opt.classList.add('disabled'));
            
            // Show correct and incorrect answers
            options[correctIndex].classList.add('correct');
            if (index !== correctIndex) {
                options[index].classList.add('incorrect');
            }
            
            // Show feedback message
            if (index === correctIndex) {
                score++;
                feedbackMessage.textContent = '🎉 Chính xác! Bạn đã trả lời đúng!';
                feedbackMessage.className = 'feedback-message correct show';
            } else {
                feedbackMessage.textContent = `❌ Sai rồi! Đáp án đúng là: ${String.fromCharCode(65 + correctIndex)}. ${quizData[currentQuestion].options[correctIndex]}`;
                feedbackMessage.className = 'feedback-message incorrect show';
            }
            
            // Show next button and auto-advance after delay
            nextBtn.style.display = 'block';
            nextBtn.disabled = false;
            
            // Auto advance to next question after 2.5 seconds
            setTimeout(() => {
                if (currentQuestion < quizData.length - 1) {
                    nextQuestion();
                } else {
                    // Enable manual finish for last question
                    nextBtn.textContent = 'Xem kết quả 🏆';
                    nextBtn.style.background = '#FF9800';
                }
            }, 10500);
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                displayQuestion();
            } else {
                finishQuiz();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
                
                // If this question was already answered, show the result
                if (userAnswers[currentQuestion] !== undefined) {
                    const userAnswer = userAnswers[currentQuestion];
                    const correctAnswer = quizData[currentQuestion].correct;
                    const options = document.querySelectorAll('.option');
                    const feedbackMessage = document.getElementById('feedbackMessage');
                    const nextBtn = document.getElementById('nextBtn');
                    
                    isAnswered = true;
                    options.forEach(opt => opt.classList.add('disabled'));
                    options[correctAnswer].classList.add('correct');
                    
                    if (userAnswer !== correctAnswer) {
                        options[userAnswer].classList.add('incorrect');
                        feedbackMessage.textContent = `❌ Bạn đã chọn sai. Đáp án đúng là: ${String.fromCharCode(65 + correctAnswer)}. ${quizData[currentQuestion].options[correctAnswer]}`;
                        feedbackMessage.className = 'feedback-message incorrect show';
                    } else {
                        feedbackMessage.textContent = '🎉 Bạn đã trả lời đúng câu này!';
                        feedbackMessage.className = 'feedback-message correct show';
                    }
                    
                    nextBtn.style.display = 'block';
                    nextBtn.disabled = false;
                }
            }
        }

        function finishQuiz() {
            stopTimer();
            
            const percentage = Math.round((score / quizData.length) * 100);
            const timeElapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(timeElapsed / 60);
            const seconds = timeElapsed % 60;
            
            // Show results
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';
            
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('correctAnswers').textContent = score;
            document.getElementById('incorrectAnswers').textContent = quizData.length - score;
            document.getElementById('timeSpent').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            let message = '';
            if (percentage >= 90) message = '🏆 Xuất sắc! Bạn là thiên tài!';
            else if (percentage >= 80) message = '👏 Rất tốt! Bạn làm được!';
            else if (percentage >= 70) message = '👍 Khá ổn! Cần cố gắng thêm!';
            else if (percentage >= 60) message = '😊 Được rồi! Hãy học thêm nhé!';
            else message = '💪 Chưa sao! Hãy thử lại!';
            
            document.getElementById('scoreText').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
            startTime = Date.now();
            isAnswered = false;
            
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';
            
            displayQuestion();
            startTimer();
        }

        // Initialize quiz
        document.addEventListener('DOMContentLoaded', () => {
            displayQuestion();
            startTimer();
        });
    </script>
</body>
</html>
